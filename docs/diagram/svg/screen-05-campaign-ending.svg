<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">캠페인 엔딩 와이어프레임</title>
  <desc id="desc">엔딩 이름과 판정 원인, 최종 등급, 파티와 선택 회고를 보여주는 화면</desc>
  <style>
    text{font-family:"Noto Sans CJK KR","Noto Sans KR","Malgun Gothic",sans-serif;fill:#f4f0e6;font-size:24px}
    .title{font-size:46px;font-weight:700}.hero{font-size:76px;font-weight:800}.grade{font-size:126px;font-weight:800}.section{font-size:30px;font-weight:700}
    .muted{fill:#cbbca5}.good{fill:#a9d39b}.warn{fill:#f0c76b}.bad{fill:#f09380}
    .panel{fill:#211a14;stroke:#cbbca5;stroke-width:3}.inset{fill:#2b241d;stroke:#8f806c;stroke-width:3}
    .accent{fill:#293526;stroke:#a9d39b;stroke-width:5}.button{fill:#342b22;stroke:#cbbca5;stroke-width:4}
  </style>
  <rect width="1920" height="1080" fill="#17130f"/>
  <rect x="30" y="24" width="1860" height="1032" rx="22" class="panel"/>

  <text x="960" y="56" text-anchor="middle">영구 등급 A  ·  현재 명성 72  ·  골드 146 / 200  ·  승급 344 / S 370  ·  남은 던전 0 / 15</text>
  <text x="960" y="108" text-anchor="middle" class="title muted">CAMPAIGN COMPLETE · SEED DS-15-042</text>
  <text x="960" y="205" text-anchor="middle" class="hero">원정 종료</text>
  <text x="960" y="258" text-anchor="middle" class="section good">✓ 던전 15개를 모두 클리어했습니다</text>
  <line x1="238" y1="292" x2="1682" y2="292" stroke="#8f806c" stroke-width="3"/>

  <rect x="74" y="328" width="430" height="306" rx="18" class="accent"/>
  <text x="289" y="382" text-anchor="middle" class="section">최종 영구 길잡이 등급</text>
  <text x="289" y="520" text-anchor="middle" class="grade good">A</text>
  <text x="289" y="578" text-anchor="middle">승급 점수 344 · 생존률 78%</text>
  <text x="289" y="614" text-anchor="middle" class="muted">정상 완주 C / B / A / S 모두 유효</text>

  <rect x="534" y="328" width="626" height="306" rx="18" class="inset"/>
  <text x="562" y="378" class="section">캠페인 요약</text>
  <text x="562" y="430">생존시킨 파티</text><text x="1108" y="430" text-anchor="end" class="good">11팀</text>
  <text x="562" y="476">전멸시킨 파티</text><text x="1108" y="476" text-anchor="end" class="bad">2팀</text>
  <text x="562" y="522">최종 명성</text><text x="1108" y="522" text-anchor="end">72</text>
  <text x="562" y="568">현재 / 누적 골드</text><text x="1108" y="568" text-anchor="end">146G / 200G</text>
  <text x="562" y="614">사망한 용사</text><text x="1108" y="614" text-anchor="end">7명 · 전멸 유품만 획득</text>

  <rect x="1190" y="328" width="656" height="306" rx="18" class="inset"/>
  <text x="1218" y="378" class="section">대표 정보 선택</text>
  <text x="1218" y="430" class="good">✓ 진실  18회</text><text x="1518" y="430" class="bad">! 거짓  12회</text>
  <text x="1218" y="476" class="warn">? 중립  9회</text><text x="1518" y="476">적발  7회</text>
  <line x1="1218" y1="506" x2="1818" y2="506" stroke="#8f806c" stroke-width="3"/>
  <text x="1218" y="552">가장 큰 전환점</text>
  <text x="1218" y="594" class="muted">검은 성가대에서 거짓을 인정하고</text>
  <text x="1218" y="626" class="muted">생존자 신뢰를 회복한 선택</text>

  <rect x="74" y="668" width="1772" height="218" rx="18" fill="#2d3b28" stroke="#a9d39b" stroke-width="5"/>
  <text x="960" y="728" text-anchor="middle" class="section good">캠페인 회고</text>
  <text x="960" y="790" text-anchor="middle" class="title">“S급 목표를 위해 어떤 선택을 했는가?”</text>
  <text x="960" y="838" text-anchor="middle" class="muted">누구에게 진실을 말했고, 누구의 의심을 감수했으며, 어떤 파티를 끝까지 지켰는가</text>

  <g text-anchor="middle">
    <rect x="314" y="922" width="404" height="86" rx="16" class="button"/><text x="516" y="976" class="section">같은 시드 기록 보기</text>
    <rect x="758" y="922" width="404" height="86" rx="16" class="button"/><text x="960" y="976" class="section">상세 원정 연대기</text>
    <rect x="1202" y="922" width="404" height="86" rx="16" fill="#3c5a35" stroke="#a9d39b" stroke-width="5"/><text x="1404" y="976" class="section">새 캠페인 시작  →</text>
  </g>
</svg>
